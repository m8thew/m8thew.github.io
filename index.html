<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <title>чпок</title>
    <style>
        :root {
            --bg: #fff;
            --text: #000;
            --subtext: #666;
            --film-bg: #f5f5f5;
            --film-border: #e8e8e8;
            --bubble-bg: #fff;
            --bubble-popped: #f0f0f0;
            --bubble-shadow-inset: rgba(0,0,0,0.1);
            --bubble-shadow-inset2: rgba(0,0,0,0.08);
            --bubble-shadow: rgba(0,0,0,0.06);
            --bubble-popped-inset: rgba(0,0,0,0.05);
            --bubble-popped-shadow: rgba(0,0,0,0.03);
            --toggle-bg: #e0e0e0;
            --toggle-knob: #fff;
            --toggle-active: #000;
        }

        [data-theme="dark"] {
            --bg: #111;
            --text: #f0f0f0;
            --subtext: #888;
            --film-bg: #1e1e1e;
            --film-border: #2a2a2a;
            --bubble-bg: #2c2c2c;
            --bubble-popped: #1a1a1a;
            --bubble-shadow-inset: rgba(255,255,255,0.07);
            --bubble-shadow-inset2: rgba(0,0,0,0.3);
            --bubble-shadow: rgba(0,0,0,0.3);
            --bubble-popped-inset: rgba(255,255,255,0.03);
            --bubble-popped-shadow: rgba(0,0,0,0.2);
            --toggle-bg: #333;
            --toggle-knob: #111;
            --toggle-active: #f0f0f0;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg);
            color: var(--text);
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            -webkit-font-smoothing: antialiased; 
            touch-action: manipulation;
            position: relative;
            overflow-x: hidden;
            transition: background 0.25s, color 0.25s;
        }
        
        .container { 
            max-width: 800px; 
            width: 100%; 
            text-align: center; 
        }
        
        .game-area { 
            display: flex; 
            justify-content: center; 
            margin-bottom: 25px; 
        }
        
        .film-container {
            position: relative;
            background: transparent;
            
            border-radius: 32px;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            box-shadow: none;
            border: none;
            transition: border-color 0.25s;
        }

            display: inline-flex;
            align-items: center;

            cursor: pointer;
            border: 1px solid currentColor;
            border-radius: 20px;
            overflow: hidden;
            opacity: 0.45;
            transition: opacity 0.2s;
            font-size: 11px;
            letter-spacing: 0.02em;
        }

        .theme-toggle:hover {
            opacity: 0.9;
        }

        .toggle-opt {
            padding: 2px 7px;
            transition: background 0.2s, color 0.2s;
            line-height: 1.6;
        }

        [data-theme="light"] .toggle-opt-light,
        [data-theme="dark"]  .toggle-opt-dark {
            background: var(--text);
            color: var(--bg);
        }
        
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            background: var(--c);
            top: -20px;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
        }
        
        @media (max-width: 768px) { 
            .film-wrapper { gap: 5px; } 
            .film-container { 
                padding: 16px; 
                border-radius: 28px;
            } 
            .info-bar { font-size: 12px; } 
        }
        
        @media (max-width: 480px) { 
            body { padding: 16px; } 
            .film-wrapper { gap: 4px; } 
            .film-container { 
                padding: 14px; 
                border-radius: 24px; 
            } 
            .info-text { flex-direction: column; gap: 6px; }

<body>
    <div class="container">
        <div class="game-area">
            <div class="film-container">
                <div class="film-wrapper" id="filmWrapper"></div>
            </div>
        </div>
        <div class="info-bar">
            <div class="info-text">
                <span class="stats">чпокнуто: <span id="poppedCount">0</span></span>
                <span class="separator">|</span>
                <span>нажми на пробел или пузырик для чпоканья</span>
                <span class="separator">|</span>
                <span>created by <a href="https://t.me/envctx" target="_blank" style="color: #1E90FF; text-decoration: none;">@m8thew</a></span>
                <span class="separator">|</span>
                <span class="theme-toggle" id="themeToggle" title="сменить тему">
                    <span class="toggle-opt toggle-opt-light">свет</span><span class="toggle-opt toggle-opt-dark">тьма</span>
                </span>
            </div>
        </div>
    </div>
    
    <script>
        const filmWrapper = document.getElementById('filmWrapper');
        const poppedCountEl = document.getElementById('poppedCount');
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        // --- Theme toggle ---
        // Берём сохранённую тему; если не было — смотрим системную (prefers-color-scheme)
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme') || (systemDark ? 'dark' : 'light');
        html.setAttribute('data-theme', savedTheme);

        themeToggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        // --- Game constants ---
        const ROWS = 9;
        const COLS = 9;
        const TOTAL = ROWS * COLS;
        const MILESTONES = [100, 1000, 10000];
        
        let popped = 0;
        let totalPopped = 0;
        let allPopped = false;
        let lastPop = 0;
        const celebrated = new Set();
        
        // --- Audio ---
        let audioContext;
        let popSoundBuffer;
        let reloadSoundBuffer;
        let audioInitialized = false;
        
        function initAudio() {
            if (audioInitialized) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                loadSound('https://cdn.jsdelivr.net/gh/m8thew/ihateeveryone@master/chpokupd1.mp3', 'pop');
                loadSound('https://cdn.jsdelivr.net/gh/m8thew/ihateeveryone@master/chpokreload.mp3', 'reload');
                audioInitialized = true;
            } catch (e) {
                console.log("Web Audio API не поддерживается");
            }
        }
        
        function loadSound(url, type) {
    fetch(url, { headers: { 'Accept': 'audio/mpeg, audio/*' } })
        .then(r => {
            console.log('fetch ok:', url, r.status, r.headers.get('content-type'));
            return r.arrayBuffer();
        })
        .then(buf => {
            console.log('arrayBuffer size:', buf.byteLength);
            return audioContext.decodeAudioData(buf);
        })
        .then(audioBuf => {
            console.log('decoded ok:', type, audioBuf.duration);
            if (type === 'pop') popSoundBuffer = audioBuf;
            else if (type === 'reload') reloadSoundBuffer = audioBuf;
        })
        .catch(e => console.log("Ошибка:", e.name, e.message, e));
}
        
        // Random pitch: playbackRate в диапазоне [minRate, maxRate]
        function playSound(buffer, volume = 0.7, pitchMin = 0.85, pitchMax = 1.18) {
            if (!audioContext || !buffer) return;
            try {
                const source = audioContext.createBufferSource();
                const gainNode = audioContext.createGain();
                source.buffer = buffer;
                gainNode.gain.value = volume;
                source.playbackRate.value = pitchMin + Math.random() * (pitchMax - pitchMin);
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                source.start(0);
                setTimeout(() => {
                    source.disconnect();
                    gainNode.disconnect();
                }, buffer.duration * 1000 + 200);
            } catch (e) {
                console.log("Ошибка воспроизведения звука");
            }
        }

        // --- Haptic feedback ---
        function haptic() {
            if (navigator.vibrate) {
                navigator.vibrate(8);
            }
            // iOS Taptic Engine via AudioContext (silent click trick)
            // Already handled by sound; no additional hack needed
        }
        
        document.addEventListener('click', initAudio, { once: false });
        document.addEventListener('touchstart', initAudio, { once: false });
        document.addEventListener('keydown', initAudio, { once: false });
        
        // --- Build bubbles ---
        for (let i = 0; i < TOTAL; i++) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble bubble-appear';
            bubble.dataset.popped = '0';
            filmWrapper.appendChild(bubble);
        }

        // --- Mouse drag to pop multiple ---
        let isMouseDown = false;

        filmWrapper.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            initAudio();
            const target = e.target.closest('.bubble');
            if (target) {
                if (target.dataset.popped === '0') popBubble(target);
                else wiggle(target);
            }
        });

        filmWrapper.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const target = e.target.closest('.bubble');
            if (target && target.dataset.popped === '0') {
                popBubble(target);
            }
        });

        document.addEventListener('mouseup', () => { isMouseDown = false; });

        // --- Touch drag to pop multiple ---
        filmWrapper.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            for (const touch of e.touches) {
                const el = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.bubble');
                if (el) {
                    if (el.dataset.popped === '0') popBubble(el);
                    else wiggle(el);
                }
            }
        }, { passive: false });

        filmWrapper.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (const touch of e.touches) {
                const el = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.bubble');
                if (el && el.dataset.popped === '0') {
                    popBubble(el);
                }
            }
        }, { passive: false });

        // --- Keyboard ---
        document.onkeydown = (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                initAudio();
                const unpopped = [...document.querySelectorAll('.bubble[data-popped="0"]')];
                if (unpopped.length) popBubble(unpopped[Math.random() * unpopped.length | 0]);
            }
        };

        function wiggle(bubble) {
            bubble.classList.remove('bubble-pulse');
            void bubble.offsetWidth;
            bubble.classList.add('bubble-pulse');
            setTimeout(() => bubble.classList.remove('bubble-pulse'), 300);
        }
        
        function popBubble(bubble) {
            const now = Date.now();
            if (now - lastPop < 20) return;
            lastPop = now;
            
            bubble.classList.add('popped');
            bubble.classList.remove('bubble-appear');
            bubble.dataset.popped = '1';
            
            popped++;
            totalPopped++;
            poppedCountEl.textContent = totalPopped;
            
            haptic();

            MILESTONES.forEach(m => {
                if (!celebrated.has(m) && totalPopped >= m) {
                    celebrated.add(m);
                    celebrate(m);
                }
            });
            
            if (popSoundBuffer) playSound(popSoundBuffer, 0.7);
            
            if (popped === TOTAL && !allPopped) {
                allPopped = true;
                setTimeout(() => {
                    if (reloadSoundBuffer) playSound(reloadSoundBuffer, 0.7, 0.95, 1.05);
                    document.querySelectorAll('.bubble').forEach(b => {
                        b.classList.remove('popped', 'bubble-pulse');
                        b.classList.add('bubble-appear');
                        b.dataset.popped = '0';
                    });
                    popped = 0;
                    allPopped = false;
                }, 300);
            }
        }
        
        function celebrate(milestone) {
            const count = milestone === 100 ? 50 : milestone === 1000 ? 100 : 200;
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff8e53', '#9b59b6', '#3498db'];
            
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.cssText = `
                    --c: ${colors[i % colors.length]};
                    left: ${Math.random() * 100}vw;
                    width: ${Math.random() * 10 + 6}px;
                    height: ${Math.random() * 10 + 6}px;
                    border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                `;
                document.body.appendChild(confetti);
                const anim = confetti.animate([
                    { top: '-20px', opacity: 0, transform: 'rotate(0deg)' },
                    { top: `${Math.random() * 80 + 10}vh`, opacity: 1, transform: `rotate(${Math.random() * 360}deg)` },
                    { top: '120vh', opacity: 0, transform: `rotate(${Math.random() * 720}deg)` }
                ], {
                    duration: Math.random() * 2000 + 1500,
                    easing: 'cubic-bezier(0.2, 0.8, 0.4, 1)'
                });
                anim.onfinish = () => confetti.remove();
            }
        }
    </script>
